<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Dan Goronyo Shop</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

<header class="header">
    <div class="header-left">
        <span class="mobile-toggle" onclick="toggleSidebar()">☰</span>
        <div class="logo">My Profile</div>
    </div>
</header>

<div class="sidebar" id="sidebar">
    <div class="logo">
        <h2>KasuApp Pro</h2>
    </div>
    <ul class="menu">
        <li onclick="goPage('index')">🏠 Home</li>
        <li onclick="goPage('profile')" class="active">👤 Profile</li>
        <li onclick="goPage('settings')">⚙️ Settings</li>
        <li onclick="goPage('upgrade')">⭐ Upgrade</li>
    </ul>
    <button onclick="logoutUser()" class="logout-btn">Logout</button>
</div>

<div class="main-content" id="main-content">
    <div class="profile-container">
        <div class="profile-header">
            <div class="avatar-section">
                <div class="avatar" id="userAvatar">👤</div>
                <button onclick="changeAvatar()" class="btn-small">Change Photo</button>
            </div>
            <div class="profile-info">
                <h2 id="userName">Shop Owner</h2>
                <p id="userEmail">owner@dangoronyo.com</p>
                <span class="badge pro">Pro Member</span>
            </div>
        </div>

        <div class="profile-section">
            <h3>Personal Information</h3>
            <form id="profileForm" onsubmit="updateProfile(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="fullName" required>
                    </div>
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="username" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone">
                </div>
                <button type="submit" class="btn-primary">Update Profile</button>
            </form>
        </div>

        <div class="profile-section">
            <h3>Security</h3>
            <form id="passwordForm" onsubmit="changePassword(event)">
                <div class="form-group">
                    <label>Current Password</label>
                    <input type="password" id="currentPassword" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>New Password</label>
                        <input type="password" id="newPassword" required>
                    </div>
                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input type="password" id="confirmPassword" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Change Password</button>
            </form>
        </div>

        <div class="profile-section">
            <h3>Account Statistics</h3>
            <div class="stats-grid">
                <div class="stat-box">
                    <span class="stat-value" id="memberSince">2024</span>
                    <span class="stat-label">Member Since</span>
                </div>
                <div class="stat-box">
                    <span class="stat-value" id="totalSalesMade">0</span>
                    <span class="stat-label">Sales Made</span>
                </div>
                <div class="stat-box">
                    <span class="stat-value" id="lastLogin">Today</span>
                    <span class="stat-label">Last Login</span>
                </div>
           </div>
        </div>
    </div>
</div>

    <div class="user-profile-mini" style="padding: 20px; border-top: 1px solid #e2e8f0; margin-top: auto;">
    <div style="display: flex; align-items: center; gap: 10px;">
        <div class="avatar-small" style="width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--secondary)); display: flex; align-items: center; justify-content: center; color: white; font-weight: 600;">
            <span class="user-initial">U</span>
        </div>
        <div style="flex: 1; overflow: hidden;">
            <div class="user-name" style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">User</div>
            <small class="shop-name" style="color: #718096;">Shop Name</small>
        </div>
        <button onclick="goPage('profile')" style="background: none; border: none; cursor: pointer; color: #718096;">
            <i class="fas fa-cog"></i>
        </button>
    </div>
</div>

<div class="bottom-nav">
    <div class="nav-item" onclick="goPage('index')">
        <span>🏠</span>
        <p>Home</p>
    </div>
    <div class="nav-item" onclick="goPage('stocks')">
        <span>📦</span>
        <p>Stock</p>
    </div>
    <div class="nav-center" onclick="goPage('sale')">+</div>
    <div class="nav-item" onclick="goPage('customers')">
        <span>👥</span>
        <p>Cust</p>
    </div>
    <div class="nav-item active" onclick="goPage('settings')">
        <span>⚙️</span>
        <p>More</p>
    </div>
</div>

<!-- Add to <head> section of all pages -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

<!-- Add before closing </body> -->
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script src="index.js"></script>

</body>
</html>
