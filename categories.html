<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Categories - Dan Goronyo Shop</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

<header class="header">
    <div class="header-left">
        <span class="mobile-toggle" onclick="toggleSidebar()">☰</span>
        <div class="logo">Categories</div>
    </div>
    <div class="header-right">
        <button onclick="openAddCategoryModal()" class="btn-primary">+ Add Category</button>
    </div>
</header>

<div class="sidebar" id="sidebar">
    <div class="logo">
        <h2>KasuApp Pro</h2>
    </div>
    <ul class="menu">
        <li onclick="goPage('index')">🏠 Home</li>
        <li onclick="goPage('stocks')">📦 Stocks</li>
        <li onclick="goPage('categories')" class="active">📂 Categories</li>
        <li onclick="goPage('settings')">⚙️ Settings</li>
    </ul>
    <button onclick="logoutUser()" class="logout-btn">Logout</button>
</div>

    <div class="user-profile-mini" style="padding: 20px; border-top: 1px solid #e2e8f0; margin-top: auto;">
    <div style="display: flex; align-items: center; gap: 10px;">
        <div class="avatar-small" style="width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--secondary)); display: flex; align-items: center; justify-content: center; color: white; font-weight: 600;">
            <span class="user-initial">U</span>
        </div>
        <div style="flex: 1; overflow: hidden;">
            <div class="user-name" style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">User</div>
            <small class="shop-name" style="color: #718096;">Shop Name</small>
        </div>
        <button onclick="goPage('profile')" style="background: none; border: none; cursor: pointer; color: #718096;">
            <i class="fas fa-cog"></i>
        </button>
    </div>
</div>

    
<div class="main-content" id="main-content">
    <div class="categories-container">
        <div id="categoriesGrid" class="categories-grid">
            <!-- Categories loaded here -->
        </div>
    </div>
</div>

<!-- Add Category Modal -->
<div id="addCategoryModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('addCategoryModal')">&times;</span>
        <h2>Add New Category</h2>
        <form id="addCategoryForm" onsubmit="saveCategory(event)">
            <div class="form-group">
                <label>Category Name *</label>
                <input type="text" id="catName" required>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="catDescription" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>Icon (Emoji)</label>
                <input type="text" id="catIcon" placeholder="📦" maxlength="2">
            </div>
            <div class="form-group">
                <label>Color</label>
                <input type="color" id="catColor" value="#667eea">
            </div>
            <button type="submit" class="btn-primary">Save Category</button>
        </form>
    </div>
</div>

    <div class="user-profile-mini" style="padding: 20px; border-top: 1px solid #e2e8f0; margin-top: auto;">
    <div style="display: flex; align-items: center; gap: 10px;">
        <div class="avatar-small" style="width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--secondary)); display: flex; align-items: center; justify-content: center; color: white; font-weight: 600;">
            <span class="user-initial">U</span>
        </div>
        <div style="flex: 1; overflow: hidden;">
            <div class="user-name" style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">User</div>
            <small class="shop-name" style="color: #718096;">Shop Name</small>
        </div>
        <button onclick="goPage('profile')" style="background: none; border: none; cursor: pointer; color: #718096;">
            <i class="fas fa-cog"></i>
        </button>
    </div>
</div>

<div class="bottom-nav">
    <div class="nav-item" onclick="goPage('index')">
        <span>🏠</span>
        <p>Home</p>
    </div>
    <div class="nav-item" onclick="goPage('stocks')">
        <span>📦</span>
        <p>Stock</p>
    </div>
    <div class="nav-center" onclick="goPage('sale')">+</div>
    <div class="nav-item" onclick="goPage('customers')">
        <span>👥</span>
        <p>Cust</p>
    </div>
    <div class="nav-item" onclick="goPage('settings')">
        <span>⚙️</span>
        <p>More</p>
    </div>
</div>
<!-- Add to <head> section of all pages -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

<!-- Add before closing </body> -->
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script src="index.js"></script>
</body>
</html>
