<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Customers - Dan Goronyo Shop</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

<header class="header">
    <div class="header-left">
        <span class="mobile-toggle" onclick="toggleSidebar()">☰</span>
        <div class="logo">Customers</div>
    </div>
    <div class="header-right">
        <button onclick="openAddCustomerModal()" class="btn-primary">+ Add Customer</button>
    </div>
</header>

<div class="sidebar" id="sidebar">
    <div class="logo">
        <h2>KasuApp Pro</h2>
    </div>
    <ul class="menu">
        <li onclick="goPage('index')">🏠 Home</li>
        <li onclick="goPage('sale')">🛒 Sale</li>
        <li onclick="goPage('customers')" class="active">👥 Customers</li>
        <li onclick="goPage('stocks')">📦 Stocks</li>
        <li onclick="goPage('settings')">⚙️ Settings</li>
    </ul>
    <button onclick="logoutUser()" class="logout-btn">Logout</button>
</div>

<div class="main-content" id="main-content">
    <div class="customers-header">
        <input type="text" id="customerSearch" placeholder="Search customers..." onkeyup="searchCustomers()">
        <div class="view-toggle">
            <button onclick="toggleView('grid')" class="active">Grid</button>
            <button onclick="toggleView('list')">List</button>
        </div>
    </div>

    <div class="customers-stats" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px;">
        <div class="stat-card">
            <h4>Total Customers</h4>
            <p id="totalCustomers">0</p>
        </div>
        <div class="stat-card">
            <h4>Active Customers</h4>
            <p id="activeCustomers">0</p>
        </div>
        <div class="stat-card warning">
            <h4>Credit Customers</h4>
            <p id="creditCustomers">0</p>
        </div>
    </div>

    <div id="customersContainer" class="customers-grid">
        <!-- Customers loaded here -->
    </div>
</div>

<!-- Add Customer Modal -->
<div id="addCustomerModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('addCustomerModal')">&times;</span>
        <h2>Add New Customer</h2>
        <form id="addCustomerForm" onsubmit="saveCustomer(event)">
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" id="custName" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Phone Number *</label>
                    <input type="tel" id="custPhone" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="custEmail">
                </div>
            </div>
            <div class="form-group">
                <label>Address</label>
                <textarea id="custAddress" rows="2"></textarea>
            </div>
            <div class="form-group">
                <label>Customer Type</label>
                <select id="custType">
                    <option value="regular">Regular</option>
                    <option value="vip">VIP</option>
                    <option value="wholesale">Wholesale</option>
                </select>
            </div>
            <div class="form-group">
                <label>Credit Limit (₦)</label>
                <input type="number" id="custCreditLimit" value="0" min="0">
            </div>
            <div class="form-group">
                <label>Notes</label>
                <textarea id="custNotes" rows="2"></textarea>
            </div>
            <button type="submit" class="btn-primary">Save Customer</button>
        </form>
    </div>
</div>

<!-- Customer Details Modal -->
<div id="customerDetailsModal" class="modal">
    <div class="modal-content large">
        <span class="close" onclick="closeModal('customerDetailsModal')">&times;</span>
        <div id="customerDetailsContent">
            <!-- Customer details loaded here -->
        </div>
    </div>
</div>

    <div class="user-profile-mini" style="padding: 20px; border-top: 1px solid #e2e8f0; margin-top: auto;">
    <div style="display: flex; align-items: center; gap: 10px;">
        <div class="avatar-small" style="width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--secondary)); display: flex; align-items: center; justify-content: center; color: white; font-weight: 600;">
            <span class="user-initial">U</span>
        </div>
        <div style="flex: 1; overflow: hidden;">
            <div class="user-name" style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">User</div>
            <small class="shop-name" style="color: #718096;">Shop Name</small>
        </div>
        <button onclick="goPage('profile')" style="background: none; border: none; cursor: pointer; color: #718096;">
            <i class="fas fa-cog"></i>
        </button>
    </div>
</div>

<div class="bottom-nav">
    <div class="nav-item" onclick="goPage('index')">
        <span>🏠</span>
        <p>Home</p>
    </div>
    <div class="nav-item" onclick="goPage('stocks')">
        <span>📦</span>
        <p>Stock</p>
    </div>
    <div class="nav-center" onclick="goPage('sale')">+</div>
    <div class="nav-item active" onclick="goPage('customers')">
        <span>👥</span>
        <p>Cust</p>
    </div>
    <div class="nav-item" onclick="goPage('settings')">
        <span>⚙️</span>
        <p>More</p>
    </div>
</div>
<!-- Add to <head> section of all pages -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

<!-- Add before closing </body> -->
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script src="index.js"></script>

</body>
</html>
